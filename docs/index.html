<!doctype html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Console UNO - Web TUI Edition</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl">
            <header class="mb-4 flex flex-wrap items-center justify-between border-b border-gray-700 pb-3">
                <div>
                    <h1 class="text-3xl font-bold tracking-wider">Console UNO</h1>
                    <p class="text-sm text-gray-400 font-mono mt-1">C# &amp; .NET 10 Terminal Game Web Engine</p>
                </div>
                <div class="mt-2 sm:mt-0 flex items-center gap-2">
                    <button
                        id="theme-btn"
                        onclick="window.UNO.toggleTheme()"
                        class="tui-btn"
                    >
                        Dark Mode
                    </button>
                    <button
                        id="sound-btn"
                        onclick="window.UNO.toggleSound()"
                        class="tui-btn"
                    >
                        Hang: BE
                    </button>
                </div>
            </header>

            <div class="tui-window">
                <div class="tui-header">
                    <span>+--- CONSOLE UNO: TUI TERMINAL ENGINE ---+</span>
                    <span class="text-xs">.NET 10 / JS</span>
                </div>

                <div
                    id="terminal-screen"
                    class="tui-body"
                    tabindex="0"
                >
                    Betoltés...
                </div>

                <div class="bg-black border-t border-gray-800 p-3 flex flex-wrap gap-2 justify-center items-center">
                    <button
                        onclick="window.UNO.moveLeft()"
                        class="tui-btn"
                    >
                        &larr; Balra
                    </button>
                    <button
                        onclick="window.UNO.playCurrent()"
                        class="tui-btn tui-btn-primary"
                    >
                        Lerakas (ENTER)
                    </button>
                    <button
                        onclick="window.UNO.moveRight()"
                        class="tui-btn"
                    >
                        Jobbra &rarr;
                    </button>
                    <button
                        onclick="window.UNO.draw()"
                        class="tui-btn tui-btn-danger"
                    >
                        Huzas (D)
                    </button>
                    <button
                        onclick="window.UNO.setScreen('MAIN_MENU')"
                        class="tui-btn"
                    >
                        Fomenu (Q)
                    </button>
                </div>
            </div>

            <footer class="mt-4 text-center text-xs text-gray-500 font-mono">
                Console UNO. Keszitette: Solti Csongor Peter.
            </footer>
        </div>

        <script src="js/game.js"></script>
    </body>
</html>
